name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the commit count on the site
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The Fontshare fonts are fetched at build time (see scripts/fetch-fonts.sh);
      # cache them so a slow or down Fontshare can't stall a deploy
      - uses: actions/cache@v6
        with:
          path: |
            public/fonts/ClashDisplay-Variable.woff2
            public/fonts/GeneralSans-Variable.woff2
            public/fonts/Tanker-Regular.woff2
          key: fontshare-${{ hashFiles('scripts/fetch-fonts.sh') }}
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
